name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install platformio
      - run: pio run
        working-directory: esp32_app
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp32_app/.pio/build/waveshare_2_8c/firmware.bin

  app:
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: esp32_app/.pio/build/waveshare_2_8c
      - run: python -m venv venv
        working-directory: host_app
      - run: .\build_exe.bat
        working-directory: host_app
        shell: cmd
      - run: Compress-Archive -Path host_app\dist\CoolerScreen -DestinationPath CoolerScreen-windows.zip
        shell: pwsh
      - run: Copy-Item esp32_app\.pio\build\waveshare_2_8c\firmware.bin firmware.bin
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            CoolerScreen-windows.zip
            firmware.bin
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: CoolerScreen-windows
          path: |
            CoolerScreen-windows.zip
            firmware.bin
