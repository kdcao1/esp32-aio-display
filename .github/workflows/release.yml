name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install platformio
      - run: pio run
        working-directory: esp32_app
      - name: Merge full flash image
        working-directory: esp32_app/.pio/build/waveshare_2_8c
        run: |
          boot_app0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          pip install esptool==4.8.1
          esptool.py --chip esp32s3 merge_bin -o firmware-full.bin --flash_mode qio --flash_size 8MB \
            0x0 bootloader.bin 0x8000 partitions.bin 0xe000 "$boot_app0" 0x10000 firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esp32_app/.pio/build/waveshare_2_8c/firmware.bin
            esp32_app/.pio/build/waveshare_2_8c/firmware-full.bin

  app:
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: esp32_app/.pio/build/waveshare_2_8c
      - run: python -m venv venv
        working-directory: host_app
      - run: .\build_exe.bat
        working-directory: host_app
        shell: cmd
      - run: Compress-Archive -Path host_app\dist\CoolerScreen -DestinationPath CoolerScreen-windows.zip
        shell: pwsh
      - run: Copy-Item esp32_app\.pio\build\waveshare_2_8c\firmware*.bin .
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            CoolerScreen-windows.zip
            firmware.bin
            firmware-full.bin
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: CoolerScreen-windows
          path: |
            CoolerScreen-windows.zip
            firmware.bin
            firmware-full.bin
