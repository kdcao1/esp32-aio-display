[env:waveshare_2_8c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
	-I include
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
	https://github.com/bitbank2/AnimatedGIF.git#2.2.0

monitor_speed = 921600
